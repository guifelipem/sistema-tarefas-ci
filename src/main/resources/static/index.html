<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas • CI</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#182334;margin:0}main{max-width:850px;margin:50px auto;padding:24px}h1{font-size:36px}section,article{background:white;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #18233408}input,textarea,select,button{font:inherit;padding:12px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}input,textarea,select{width:100%;margin:6px 0 14px}button{background:#176d58;color:white;cursor:pointer;margin:4px}button.secondary{background:#334155}button.danger{background:#a52c3e}.muted{color:#64748b}#mensagem{min-height:24px}article h3{margin:0}article p{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><span class="muted">PROJETO ACADÊMICO · JAVA + CI</span><h1>Minhas tarefas</h1><p class="muted">Organize, conclua e acompanhe suas atividades.</p><section><h2 id="formTitulo">Nova tarefa</h2><form id="form"><label>Título<input id="titulo" maxlength="120" required></label><label>Descrição<textarea id="descricao" maxlength="1000"></textarea></label><label>Status<select id="status"><option value="PENDENTE">Pendente</option><option value="CONCLUIDA">Concluída</option></select></label><button>Salvar tarefa</button><button type="button" class="secondary" id="cancelar">Limpar</button></form></section><p id="mensagem" role="status"></p><div id="lista"></div></main>
<script>
let editando=null;const el=id=>document.getElementById(id);const mensagem=t=>el('mensagem').textContent=t;
async function api(path='',options={}){const r=await fetch('/api/tarefas'+path,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok)throw new Error(r.status===400?'Confira o título e os dados informados.':'Não foi possível completar a operação ('+r.status+').');return r.status===204?null:r.json()}
function limpar(){editando=null;el('form').reset();el('formTitulo').textContent='Nova tarefa'}
async function carregar(){try{const tarefas=await api();el('lista').replaceChildren();if(!tarefas.length){el('lista').textContent='Nenhuma tarefa cadastrada. Bora começar?';return}for(const t of tarefas){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=t.titulo;const p=document.createElement('p');p.textContent=t.descricao||'Sem descrição';const s=document.createElement('p');s.className='muted';s.textContent=(t.status==='CONCLUIDA'?'✓ Concluída':'◷ Pendente')+' · '+new Date(t.dataCriacao).toLocaleString('pt-BR');a.append(h,p,s);function botao(texto,classe,acao){const b=document.createElement('button');b.textContent=texto;b.className=classe;b.onclick=async()=>{try{await acao()}catch(e){mensagem(e.message)}};a.append(b)}botao('Editar','secondary',()=>{editando=t.id;el('titulo').value=t.titulo;el('descricao').value=t.descricao||'';el('status').value=t.status;el('formTitulo').textContent='Editar tarefa';el('titulo').focus()});if(t.status==='PENDENTE')botao('Concluir','',async()=>{await api('/'+t.id+'/concluir',{method:'PATCH'});await carregar()});botao('Excluir','danger',async()=>{if(confirm('Excluir esta tarefa?')){await api('/'+t.id,{method:'DELETE'});if(editando===t.id)limpar();await carregar()}});el('lista').append(a)}}catch(e){mensagem(e.message)}}
el('form').onsubmit=async e=>{e.preventDefault();try{await api(editando?'/'+editando:'',{method:editando?'PUT':'POST',body:JSON.stringify({titulo:el('titulo').value,descricao:el('descricao').value,status:el('status').value})});limpar();mensagem('Tarefa salva!');await carregar()}catch(e){mensagem(e.message)}};el('cancelar').onclick=limpar;carregar();
</script></html>
